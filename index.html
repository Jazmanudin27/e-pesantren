<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link id="nwf-favicon" rel="icon" type="image/png" href="/nwf.png" />
    <link id="nwf-apple-icon" rel="apple-touch-icon" href="/nwf.png" />
    <link rel="manifest" href="/manifest.json?v=5" />
    <meta name="theme-color" content="#0d766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NWF Mobile" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NWF Mobile</title>
    <!-- Google Fonts & CDN Preconnect -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Midtrans Snap JS SDK (Sandbox) & Telemetry Suppressor + Early PWA Prompt Capture -->
    <script>
      (function() {
        // 1. Tangkap event beforeinstallprompt sedini mungkin (sebelum React mount / saat SplashScreen)
        window.__deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredPwaPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-install-available', { detail: e }));
        });
        window.addEventListener('appinstalled', function() {
          window.__deferredPwaPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-app-installed'));
        });

        // 2. Generate Padded App Icon dari /nwf.png via Canvas agar Logo 100% muncul & proporsional (tidak kepotong)
        window.addEventListener('load', function() {
          try {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
              const makeIconBlob = function(size, isMaskable, cb) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const center = size / 2;

                const bgGrad = ctx.createLinearGradient(0, 0, size, size);
                bgGrad.addColorStop(0, '#064e3b');
                bgGrad.addColorStop(0.5, '#0d766e');
                bgGrad.addColorStop(1, '#059669');

                if (isMaskable) {
                  ctx.fillStyle = bgGrad;
                  ctx.fillRect(0, 0, size, size);
                } else {
                  const r = size * 0.22;
                  ctx.beginPath();
                  if (ctx.roundRect) ctx.roundRect(0, 0, size, size, r);
                  else ctx.rect(0, 0, size, size);
                  ctx.fillStyle = bgGrad;
                  ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(center, center, size * 0.37, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(167, 243, 208, 0.85)';
                ctx.lineWidth = Math.max(2, size * 0.012);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(center, center, size * 0.345, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                const logoSize = size * 0.56;
                const offset = (size - logoSize) / 2;
                ctx.drawImage(img, offset, offset, logoSize, logoSize);

                if (size === 192 && !isMaskable) {
                  try {
                    const dataUrl = canvas.toDataURL('image/png');
                    const fav = document.getElementById('nwf-favicon');
                    const apple = document.getElementById('nwf-apple-icon');
                    if (fav) fav.href = dataUrl;
                    if (apple) apple.href = dataUrl;
                  } catch (e) {}
                }

                if (canvas.toBlob && 'caches' in window) {
                  canvas.toBlob(function(blob) {
                    if (blob && cb) cb(blob);
                  }, 'image/png');
                }
              };

              if ('caches' in window) {
                caches.open('nwf-mobile-v5').then(function(cache) {
                  makeIconBlob(192, false, function(b) {
                    const res = new Response(b, { headers: { 'Content-Type': 'image/png' } });
                    cache.put('/pwa-icon-192.png', res.clone());
                    cache.put('/pwa-icon-192.png?v=5', res);
                  });
                  makeIconBlob(512, false, function(b) {
                    const res = new Response(b, { headers: { 'Content-Type': 'image/png' } });
                    cache.put('/pwa-icon-512.png', res.clone());
                    cache.put('/pwa-icon-512.png?v=5', res);
                  });
                  makeIconBlob(512, true, function(b) {
                    const res = new Response(b, { headers: { 'Content-Type': 'image/png' } });
                    cache.put('/pwa-icon-maskable-512.png', res.clone());
                    cache.put('/pwa-icon-maskable-512.png?v=5', res);
                  });
                }).catch(function() {});
              }
            };
            img.src = '/nwf.png';
          } catch (e) {}
        });

        // 3. Redam pesan error telemetri Faro GoPay yang diblokir oleh AdBlocker di browser
        const origConsoleError = console.error;
        console.error = function(...args) {
          const str = args.map(a => String(a?.message || a || '')).join(' ');
          if (str.includes('faro') || str.includes('katulampa') || str.includes('gopay.sh') || str.includes('ERR_BLOCKED_BY_CLIENT')) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(e) {
          const reasonStr = String(e?.reason?.message || e?.reason || '');
          if (reasonStr.includes('faro') || reasonStr.includes('gopay.sh') || reasonStr.includes('Failed to fetch')) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="SB-Mid-client-gtkZiSrCZjZHYwwZ"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
