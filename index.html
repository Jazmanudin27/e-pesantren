<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link id="nwf-favicon" rel="icon" type="image/png" href="/nwf.png" />
    <link id="nwf-apple-icon" rel="apple-touch-icon" href="/nwf.png" />
    <link rel="manifest" href="/manifest.json?v=6" />
    <meta name="theme-color" content="#0d766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NWF Mobile" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NWF Mobile</title>
    <!-- Google Fonts & CDN Preconnect -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      /* Cegah Layar Putih / Blank Saat Reload: Langsung warnai sejak milidetik 0 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #0369a1;
        background: linear-gradient(145deg, #0284c7 0%, #0369a1 35%, #064e3b 85%, #022c22 100%);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        overscroll-behavior-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #pre-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #0284c7 0%, #0369a1 35%, #064e3b 85%, #022c22 100%);
        color: #ffffff;
        z-index: 99999;
        text-align: center;
      }
      #pre-splash .emblem {
        width: 86px;
        height: 86px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35), 0 0 25px rgba(52, 211, 153, 0.35);
        margin-bottom: 18px;
        animation: preSplashPulse 1.8s ease-in-out infinite;
      }
      #pre-splash .emblem-inner {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
        box-sizing: border-box;
      }
      #pre-splash .emblem-inner img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #pre-splash h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      #pre-splash p {
        margin: 6px 0 0 0;
        font-size: 0.72rem;
        font-weight: 600;
        color: #7dd3fc;
        letter-spacing: 0.5px;
      }
      #pre-splash .spinner {
        width: 22px;
        height: 22px;
        border: 2.5px solid rgba(255, 255, 255, 0.25);
        border-top-color: #38bdf8;
        border-radius: 50%;
        margin-top: 26px;
        animation: preSplashSpin 0.75s linear infinite;
      }
      @keyframes preSplashPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes preSplashSpin {
        to { transform: rotate(360deg); }
      }
    </style>
    <!-- Midtrans Snap JS SDK (Sandbox) & Telemetry Suppressor + Early PWA Prompt Capture -->
    <script>
      (function() {
        // 1. Tangkap event beforeinstallprompt sedini mungkin (sebelum React mount / saat SplashScreen)
        window.__deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredPwaPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-install-available', { detail: e }));
        });
        window.addEventListener('appinstalled', function() {
          window.__deferredPwaPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-app-installed'));
        });

        // 2. Generate Padded App Icon Berlatar Putih Bersih (#ffffff) dari /nwf.png via Canvas (Tanpa Warna Hijau)
        window.addEventListener('load', function() {
          try {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
              const makeIconBlob = function(size, cb) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // Background Putih Bersih (#ffffff) tanpa warna hijau
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);

                // Logo NWF proporsional di tengah (72%)
                const logoSize = Math.round(size * 0.72);
                const offset = Math.round((size - logoSize) / 2);
                ctx.drawImage(img, offset, offset, logoSize, logoSize);

                if (size === 192) {
                  try {
                    const dataUrl = canvas.toDataURL('image/png');
                    const fav = document.getElementById('nwf-favicon');
                    const apple = document.getElementById('nwf-apple-icon');
                    if (fav) fav.href = dataUrl;
                    if (apple) apple.href = dataUrl;
                  } catch (e) {}
                }

                if (canvas.toBlob && 'caches' in window) {
                  canvas.toBlob(function(blob) {
                    if (blob && cb) cb(blob);
                  }, 'image/png');
                }
              };

              if ('caches' in window) {
                caches.open('nwf-mobile-v6').then(function(cache) {
                  makeIconBlob(192, function(b) {
                    const res = new Response(b, { headers: { 'Content-Type': 'image/png' } });
                    cache.put('/pwa-icon-192.png', res.clone());
                    cache.put('/pwa-icon-192.png?v=6', res.clone());
                    cache.put('/pwa-icon-maskable-192.png?v=6', res);
                  });
                  makeIconBlob(256, function(b) {
                    const res = new Response(b, { headers: { 'Content-Type': 'image/png' } });
                    cache.put('/pwa-icon-256.png', res.clone());
                    cache.put('/pwa-icon-256.png?v=6', res);
                  });
                }).catch(function() {});
              }
            };
            img.src = '/nwf.png';
          } catch (e) {}
        });

        // 3. Redam pesan error telemetri Faro GoPay yang diblokir oleh AdBlocker di browser
        const origConsoleError = console.error;
        console.error = function(...args) {
          const str = args.map(a => String(a?.message || a || '')).join(' ');
          if (str.includes('faro') || str.includes('katulampa') || str.includes('gopay.sh') || str.includes('ERR_BLOCKED_BY_CLIENT')) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(e) {
          const reasonStr = String(e?.reason?.message || e?.reason || '');
          if (reasonStr.includes('faro') || reasonStr.includes('gopay.sh') || reasonStr.includes('Failed to fetch')) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="SB-Mid-client-gtkZiSrCZjZHYwwZ" async defer></script>
  </head>
  <body>
    <div id="root">
      <div id="pre-splash">
        <div class="emblem">
          <div class="emblem-inner">
            <img src="/nwf.png" alt="NWF" />
          </div>
        </div>
        <h1>NWF Mobile</h1>
        <p>Pondok Pesantren Modern Nurul Wafa</p>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
