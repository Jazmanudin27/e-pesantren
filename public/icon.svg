<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.16"/>
    </filter>
  </defs>
  
  <!-- Base Squircle Background with subtle border -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="120" fill="none" stroke="#e2e8f0" stroke-width="6"/>

  <!-- NWF Pesantren Logo with 18% generous breathing room padding -->
  <image href="/nwf.png" x="72" y="72" width="368" height="368" preserveAspectRatio="xMidYMid meet" filter="url(#softShadow)"/>
</svg>

